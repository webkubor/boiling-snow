<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="boilingGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="0" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <title>Boiling Snow Favicon</title>
  <g filter="url(#glow)">
    <path d="M256 80 L286 200 L256 432 L226 200 Z" fill="url(#boilingGradient)" />
    <path d="M256 256 L120 180 M256 256 L392 180" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.9" />
    <path d="M120 180 L100 140 M120 180 L80 190" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.7" />
    <path d="M392 180 L412 140 M392 180 L432 190" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.7" />
    <path d="M256 256 C 180 320, 150 400, 160 460" stroke="#8B0000" stroke-width="24" stroke-linecap="round" />
    <path d="M256 256 C 332 320, 362 400, 352 460" stroke="#8B0000" stroke-width="24" stroke-linecap="round" />
    <circle cx="256" cy="432" r="12" fill="#8B0000" />
  </g>
</svg>
