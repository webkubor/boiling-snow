<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《沸腾之雪》天榜动作图鉴 - 瞬时抓拍版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        :root {
            --wuxia-black: #0a0a0a;
            --wuxia-gold: #d4af37;
            --wuxia-silver: #e0e0e0;
            --wuxia-white: #f8f8f8;
        }
        body {
            background-color: var(--wuxia-black);
            color: var(--wuxia-white);
            font-family: 'Noto Serif SC', serif;
            overflow-x: hidden;
        }
        .brush-font {
            font-family: 'Ma Shan Zheng', cursive;
        }
        .action-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }
        .action-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }
        .motion-blur-text {
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
    </style>
</head>
<body class="p-8 md:p-16">
    <header class="mb-20 text-center">
        <h1 class="brush-font text-6xl md:text-8xl mb-4 text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-600">瞬影·天榜</h1>
        <p class="text-gray-400 tracking-[0.5em] uppercase text-sm">瞬时抓拍 · 绝命瞬间 · 高武物理美学</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 max-w-[1400px] mx-auto">
        
        <!-- 苏梦城 -->
        <div class="action-card relative group">
            <img src="references/costume_designs/su_mengcheng/su_mengcheng_grandmaster_strike.png" alt="苏梦城" class="w-full aspect-video object-cover grayscale-[0.2] group-hover:grayscale-0 transition-all duration-700">
            <div class="absolute bottom-0 left-0 w-full p-8 bg-gradient-to-t from-black to-transparent">
                <h2 class="brush-font text-4xl mb-2">苏梦城 · 龙战于野</h2>
                <p class="text-sm text-gray-400">银枪【惊鸿】全长度抓拍。重磅锦袍随风狂舞，尽显南楚枪神的霸道王权与宗师气度。</p>
            </div>
        </div>

        <!-- 慕北歌 -->
        <div class="action-card relative group">
            <img src="references/costume_designs/mu_beige/mu_beige_action_snapshot.png" alt="慕北歌" class="w-full aspect-video object-cover grayscale-[0.2] group-hover:grayscale-0 transition-all duration-700">
            <div class="absolute bottom-0 left-0 w-full p-8 bg-gradient-to-t from-black to-transparent">
                <h2 class="brush-font text-4xl mb-2">慕北歌 · 问雪凌霜</h2>
                <p class="text-sm text-gray-400">凌空飘落抓拍。白袍如云，指触剑柄，于寂静中蕴含极致的潇洒。</p>
            </div>
        </div>

        <!-- 欧阳狂徒 -->
        <div class="action-card relative group">
            <img src="references/costume_designs/ouyang_kuangtu/ouyang_kuangtu_action_snapshot.png" alt="欧阳狂徒" class="w-full aspect-video object-cover grayscale-[0.2] group-hover:grayscale-0 transition-all duration-700">
            <div class="absolute bottom-0 left-0 w-full p-8 bg-gradient-to-t from-black to-transparent">
                <h2 class="brush-font text-4xl mb-2">欧阳狂徒 · 破军怒斩</h2>
                <p class="text-sm text-gray-400">力劈华山瞬间。黑铁巨刃【破军】承载千钧之势，肌肉张力与血性咆哮。</p>
            </div>
        </div>

        <!-- 萧烬弦 -->
        <div class="action-card relative group">
            <img src="references/costume_designs/xiao_jinxian/xiao_jinxian_action_snapshot.png" alt="萧烬弦" class="w-full aspect-video object-cover grayscale-[0.2] group-hover:grayscale-0 transition-all duration-700">
            <div class="absolute bottom-0 left-0 w-full p-8 bg-gradient-to-t from-black to-transparent">
                <h2 class="brush-font text-4xl mb-2">萧烬弦 · 玄弓瞬息</h2>
                <p class="text-sm text-gray-400">腾空侧翻开弓。神兵【乌麟】满弦如月，箭气破空，极尽利落之能事。</p>
            </div>
        </div>

    </div>

    <footer class="mt-24 text-center text-[10px] text-gray-600 tracking-widest uppercase">
        &copy; 2026 Cinematic Storyboard Pro · 高武写实动作实验室
    </footer>
</body>
</html>
