<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《沸腾之雪》女角色全样式图鉴 - 汇总珍藏版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        :root {
            --wuxia-black: #050505;
            --wuxia-silver: #c0c0c0;
            --wuxia-gold: #d4af37;
            --wuxia-red: #8b0000;
            --wuxia-blue: #00bfff;
            --wuxia-white: #f8f8f8;
        }
        body {
            background-color: var(--wuxia-black);
            color: var(--wuxia-white);
            font-family: 'Noto Serif SC', serif;
            overflow-x: hidden;
        }
        .brush-font {
            font-family: 'Ma Shan Zheng', cursive;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-5px);
        }
        .grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.03;
            pointer-events: none;
            z-index: 100;
        }
        .char-section {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 4rem;
            margin-top: 4rem;
        }
    </style>
</head>
<body class="p-8 md:p-16">
    <div class="grain"></div>

    <header class="mb-20 text-center">
        <h1 class="brush-font text-7xl mb-4 text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-600">沸雪·红颜录</h1>
        <p class="text-gray-500 tracking-[0.8em] uppercase text-sm">全样式汇总 · 珍藏所有灵感瞬间</p>
    </header>

    <!-- 顾栖月 -->
    <section class="char-section">
        <div class="flex items-center justify-between mb-12">
            <h2 class="brush-font text-5xl text-gray-200">顾栖月 <span class="text-sm tracking-widest text-gray-600 font-sans ml-4">RANK 09</span></h2>
            <div class="h-[1px] flex-grow mx-8 bg-gradient-to-r from-gray-800 to-transparent"></div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div class="glass-card p-2"><img src="references/costume_designs/gu_qiyue/gu_qiyue_bamboo_wind_blown_final.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-gray-500">风吹长裙·终版</p></div>
            <div class="glass-card p-2"><img src="references/costume_designs/gu_qiyue/gu_qiyue_water_moon.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-gray-500">水月惊鸿(新)</p></div>
            <div class="glass-card p-2"><img src="references/costume_designs/gu_qiyue/gu_qiyue_orchid_dream.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-gray-500">醉梦兰馨(新)</p></div>
            <div class="glass-card p-2"><img src="references/costume_designs/gu_qiyue/gu_qiyue_celestial_final.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-gray-500">云丝鹤羽</p></div>
            <div class="glass-card p-2"><img src="references/costume_designs/gu_qiyue/gu_qiyue_winter_final.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-gray-500">寒梅映雪</p></div>
            <div class="glass-card p-2"><img src="references/costume_designs/gu_qiyue/gu_qiyue_palace_final.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-gray-500">月影流光</p></div>
        </div>
    </section>

    <!-- 燕照绫 -->
    <section class="char-section">
        <div class="flex items-center justify-between mb-12">
            <h2 class="brush-font text-5xl text-red-200">燕照绫 <span class="text-sm tracking-widest text-red-900 font-sans ml-4">RANK 10</span></h2>
            <div class="h-[1px] flex-grow mx-8 bg-gradient-to-r from-red-900/30 to-transparent"></div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div class="glass-card p-2 border-red-900/20"><img src="references/costume_designs/yan_zhaoling/yan_zhaoling_high_boots_v1.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-red-500">古代长靴·标准版</p></div>
            <div class="glass-card p-2 border-red-900/20"><img src="references/costume_designs/yan_zhaoling/yan_zhaoling_scorching_sun.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-red-500">烈日炙阳(新)</p></div>
            <div class="glass-card p-2 border-red-900/20"><img src="references/costume_designs/yan_zhaoling/yan_zhaoling_obsidian_blade.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-red-500">黑岩冷锋(新)</p></div>
            <div class="glass-card p-2 border-red-900/20"><img src="references/costume_designs/yan_zhaoling/yan_zhaoling_wild_fur.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-red-500">分体兽皮·野性</p></div>
            <div class="glass-card p-2 border-red-900/20"><img src="references/costume_designs/yan_zhaoling/yan_zhaoling_cold_lethal.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-red-500">冷峻宗师</p></div>
            <div class="glass-card p-2 border-red-900/20"><img src="references/costume_designs/yan_zhaoling/yan_zhaoling_combat_arc.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-red-500">动态横扫</p></div>
        </div>
    </section>

    <!-- 慕夕歌 -->
    <section class="char-section">
        <div class="flex items-center justify-between mb-12">
            <h2 class="brush-font text-5xl text-blue-200">慕夕歌 <span class="text-sm tracking-widest text-blue-900 font-sans ml-4">MAIN HEROINE</span></h2>
            <div class="h-[1px] flex-grow mx-8 bg-gradient-to-r from-blue-900/30 to-transparent"></div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div class="glass-card p-2 border-blue-900/20"><img src="references/costume_designs/mu_xige/mu_xige_high_boots_v1.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-blue-400">丝绸长靴·标准版</p></div>
            <div class="glass-card p-2 border-blue-900/20"><img src="references/costume_designs/mu_xige/mu_xige_spring_bloom.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-blue-400">春意闹(新)</p></div>
            <div class="glass-card p-2 border-blue-900/20"><img src="references/costume_designs/mu_xige/mu_xige_ink_frost.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-blue-400">墨染霜华(新)</p></div>
            <div class="glass-card p-2 border-blue-900/20"><img src="references/costume_designs/mu_xige/mu_xige_snow_bud.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-blue-400">孤山雪芽</p></div>
            <div class="glass-card p-2 border-blue-900/20"><img src="references/costume_designs/mu_xige/mu_xige_thunder_blue.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-blue-400">惊蛰蓝调</p></div>
            <div class="glass-card p-2 border-blue-900/20"><img src="references/costume_designs/mu_xige/mu_xige_sweet_sword.png" class="aspect-[3/4] object-cover"><p class="text-[10px] mt-2 text-center text-blue-400">流白孤月</p></div>
        </div>
    </section>

    <footer class="mt-24 text-center text-[10px] text-gray-600 tracking-widest uppercase">
        &copy; 2026 Cinematic Storyboard Pro · 沸腾之雪制作组 · 尊重每一份灵感
    </footer>
</body>
</html>
